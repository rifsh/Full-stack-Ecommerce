<div class="w-[1288px]">
    <div class="top flex flex-col items-center justify-center mt-20">
        <div>
            <svg width="100px" height="100px" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink" fill="#000000">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                    <title></title>
                    <g fill="none" fill-rule="evenodd" id="页面-1" stroke="none" stroke-width="1">
                        <g id="导航图标" transform="translate(-325.000000, -80.000000)">
                            <g id="编组" transform="translate(325.000000, 80.000000)">
                                <polygon fill="#FFFFFF" fill-opacity="0.01" fill-rule="nonzero" id="路径"
                                    points="24 0 0 0 0 24 24 24"></polygon>
                                <polygon id="路径" points="22 7 12 2 2 7 2 17 12 22 22 17" stroke="#212121"
                                    stroke-linejoin="round" stroke-width="1.5">
                                </polygon>
                                <line id="路径" stroke="#212121" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.5" x1="2" x2="12" y1="7" y2="12"></line>
                                <line id="路径" stroke="#212121" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.5" x1="12" x2="12" y1="22" y2="12"></line>
                                <line id="路径" stroke="#212121" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.5" x1="22" x2="12" y1="7" y2="12"></line>
                                <line id="路径" stroke="#212121" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.5" x1="17" x2="7" y1="4.5" y2="9.5"></line>
                            </g>
                        </g>
                    </g>
                </g>
            </svg>
        </div>
        <h1 class="text-6xl font-medium text-gray-500 font-mono">
            Products
        </h1>
    </div>
    <div class="flex justify-end me-10">
        <button routerLink="../add-product"
            class="bg-green-500 py-2 px-3 rounded-lg text-white font-bold hover:bg-green-600 transition-all">Add
            Product</button>
    </div>
    <div class="products px-6">
        <div class="overflow-x-auto  overflow-scroll h-[500px]" >
            <table class="min-w-full bg-white">
                <thead class="sticky mt-1 top-0">
                    <tr>
                        <th class="text-left py-4 px-4 border-b border-gray-300 bg-white">Product name</th>
                        <th class="text-left py-4 px-4 border-b border-gray-300 bg-white">Author</th>
                        <th class="text-left py-4 px-4 border-b border-gray-300 bg-white">Desription</th>
                        <th class="text-left py-4 px-4 border-b border-gray-300 bg-white">Genre</th>
                        <th class="text-left py-4 px-4 border-b border-gray-300 bg-white">Price</th>
                        <th class="text-left py-4 px-4 border-b border-gray-300 bg-white" colspan="2">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of allProdutcs">
                        <td class="py-2  border-b border-gray-300">
                            <div class="flex items-center">
                                <button (click)="removeProducts(item._id)">
                                    <svg width="30px" height="30px" viewBox="0 0 1024 1024" fill="#b0b0b0" class="icon"
                                        version="1.1" xmlns="http://www.w3.org/2000/svg" stroke="#b0b0b0">
                                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round">
                                        </g>
                                        <g id="SVGRepo_iconCarrier">
                                            <path
                                                d="M32 241.6c-11.2 0-20-8.8-20-20s8.8-20 20-20l940 1.6c11.2 0 20 8.8 20 20s-8.8 20-20 20L32 241.6zM186.4 282.4c0-11.2 8.8-20 20-20s20 8.8 20 20v688.8l585.6-6.4V289.6c0-11.2 8.8-20 20-20s20 8.8 20 20v716.8l-666.4 7.2V282.4z"
                                                fill=""></path>
                                            <path
                                                d="M682.4 867.2c-11.2 0-20-8.8-20-20V372c0-11.2 8.8-20 20-20s20 8.8 20 20v475.2c0.8 11.2-8.8 20-20 20zM367.2 867.2c-11.2 0-20-8.8-20-20V372c0-11.2 8.8-20 20-20s20 8.8 20 20v475.2c0.8 11.2-8.8 20-20 20zM524.8 867.2c-11.2 0-20-8.8-20-20V372c0-11.2 8.8-20 20-20s20 8.8 20 20v475.2c0.8 11.2-8.8 20-20 20zM655.2 213.6v-48.8c0-17.6-14.4-32-32-32H418.4c-18.4 0-32 14.4-32 32.8V208h-40v-42.4c0-40 32.8-72.8 72.8-72.8H624c40 0 72.8 32.8 72.8 72.8v48.8h-41.6z"
                                                fill=""></path>
                                        </g>
                                    </svg>
                                </button>
                                <img width="100px" height="100px" class="mx-3" [src]="item.image" alt="">
                                <p class="text-lg">{{item.title}}</p>
                            </div>

                        </td>
                        <td class="py-2 px-4 border-b border-gray-300 font-mono font-bold">{{item.author}}</td>
                        <td class="py-2 px-4 border-b border-gray-300">{{item.description}}</td>
                        <td class="py-2 px-4 border-b border-gray-300">{{item.category}}</td>
                        <td class="py-2 px-4 border-b border-gray-300">{{item.price | currency:'INR'}}</td>
                        <td class="py-2 px-4 border-b border-gray-300">
                            <button [routerLink]="'../admin-edit/'+(item._id)"
                                class="bg-blue-600 py-1 px-3 rounded-md text-white hover:bg-blue-700 transition-all">
                                Edit
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- <div *ngIf="loading" class="loader">Loading...</div> -->
        </div>
    </div>
</div>
