<app-nav-bar></app-nav-bar>

<div class="flex items-start justify-start ms-10" *ngIf="userDetails">
    <div class="flex flex-col justify-center items-center mt-7">
        <h1 class="text-2xl font-bold font-sans">Account Info</h1>
        <div class="flex flex-col items-center mt-10">
            <img [src]="userDetails?.image" alt="" class="rounded-full w-[150px] h-[150px] object-cover">
            <p class="text-xl mt-1 font-serif font-semibold">{{userDetails?.name}}</p>
        </div>
    </div>
    <div
        class="ms-20 mt-[80px] border-2 pt-9 pb-4 px-3 w-[290px] h-full bg-white bg-opacity-50 backdrop-blur-3xl rounded-lg shadow-xl shadow-gray-400">
        <form action="" class="flex flex-col items-center justify-between font-medium font-sans">
            <div class="flex flex-col items-start justify-center mb-4 w-full">
                <label for="name">Name</label>
                <input type="text" class="bg-gray-100 rounded-md p-2 w-full" value="{{userDetails?.name}}"
                    [readonly]="!editMode">
            </div>
            <div class="flex flex-col items-start justify-center mb-4 w-full">
                <label for="username">User name</label>
                <input type="text" class="bg-gray-100 rounded-md p-2 w-full" value="{{userDetails?.usrname}}"
                    [readonly]="!editMode">
            </div>
            <div class="flex flex-col items-start justify-center mb-4 w-full">
                <label for="email">Email</label>
                <input type="text" class="bg-gray-100 rounded-md p-2 w-full" value="{{userDetails?.email}}"
                    [readonly]="!editMode">
            </div>
            <div class="flex flex-col items-start justify-center mb-4 w-full">
                <label for="phone">Phone</label>
                <input type="text" class="bg-gray-100 rounded-md p-2 w-full" [readonly]="!editMode">
            </div>
            <div class="flex flex-col items-start justify-center w-full">
                <label for="address">Address</label>
                <input type="text" class="bg-gray-100 rounded-md p-2 w-full" [readonly]="!editMode">
            </div>
            <div class="flex items-center justify-center w-full mt-2">
                <button *ngIf="!editMode"
                    class="bg-violet-400 hover:bg-violet-500 transition-all font-mono py-[10px] px-[10px] rounded-lg"
                    (click)="toggleEditMode()">Edit
                    Profile</button>
                <button *ngIf="editMode" (click)="cancel()"
                    class="bg-violet-400 hover:bg-violet-500 transition-all font-mono py-[10px] px-[10px] rounded-lg">Cancel</button>
                <button *ngIf="editMode"
                    class="bg-violet-400 ms-5 hover:bg-violet-500 transition-all font-mono py-[10px] px-[10px] rounded-lg">Submit</button>
            </div>
        </form>
    </div>
</div>
