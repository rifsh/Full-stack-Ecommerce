<section class="vh-100" style="background-color: #eee;">
  <div class="container h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-12 col-xl-11">
        <div class="card text-black" style="border-radius: 25px;">
          <div class="card-body p-md-5">
            <div class="flex flex-row-reverse items-center justify-around">

              <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Sign up</p>

                <form action="" class="flex flex-col items-center justify-between w-full" (ngSubmit)="onFormSubmitted()"
                  #regForm="ngForm">

                  <div class="d-flex flex-row align-items-center w-full ">
                    <i class="fas fa-user fa-lg fa-fw"></i>
                    <div class="form-outline flex-fill mb-0">
                      <input type="text" id="form3Example1c" class="form-control" required name="regName"
                        #rName="ngModel" ngModel />
                      <label for="form3Example1c" class="text-gray-700 font-bold">Name</label>
                      <div *ngIf="!rName.untouched && !rName.valid">
                        <small>*Name is required</small>
                      </div>
                    </div>
                  </div>

                  <div class="d-flex flex-row align-items-center w-full mt-8 mb-8">
                    <i class="fas fa-user fa-lg  fa-fw"></i>
                    <div class="form-outline flex-fill mb-0">
                      <input type="text" id="form4Example1c" class="form-control" required name="regusername"
                        #ruName="ngModel" ngModel />
                      <label for="form4Example1c" class="text-gray-700 font-bold">Username</label>
                      <div *ngIf="!ruName.untouched && !ruName.valid">
                        <small>*Username is required</small>
                      </div>
                    </div>
                  </div>

                  <div class="d-flex flex-row align-items-center w-full mb-8">
                    <i class="fas fa-envelope fa-lg  fa-fw"></i>
                    <div class="form-outline flex-fill mb-0">
                      <input type="email" id="form3Example3c" class="form-control" email required name="regEmail"
                        #rEmail="ngModel" ngModel />
                      <label for="form3Example3c" class="text-gray-700 font-bold">Email</label>
                      <div *ngIf="!rEmail.untouched && !rEmail.valid">
                        <small>*Email is required</small>
                      </div>
                    </div>
                  </div>

                  <div
                    class="mb-8 flex items-center justify-between ps-1 py-[3px] rounded-md border border-gray-200 bg-white w-full">
                    <div class="flex items-center">
                      <label for="image" class="text-gray-700 font-bold">Profile Image</label>
                    </div>
                    <div class="flex items-center">
                      <input type="file" id="image" name="image" required ngModel (change)="selectImage($event)"
                        class="hidden">
                      <label for="image" class="cursor-pointer text-blue-500 font-medium">
                        <i class='bx bx-image-alt text-black text-3xl'></i>
                      </label>
                    </div>
                  </div>

                  <div class="flex flex-col w-full mb-8">
                    <div class="relative">
                      <input type="password" id="password" name="regPassword" ngModel required
                        class="appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        placeholder="Enter your password" [type]="hide ? 'text' : 'password'">
                      <button type="button" class="absolute top-0 right-0 p-2 text-gray-500 hover:text-gray-700"
                        (click)="togglingPasswordView('password')">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                      </button>
                    <label for="password" class="text-gray-700 font-bold">Password</label>
                      
                    </div>
                  </div>
                  <div class="flex flex-col w-full mb-8">
                    <div class="relative">
                      <input type="password" id="password" name="regrePassword" ngModel required
                        class="appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        placeholder="Re enter your password" [type]="confirmPasswordHide ? 'text' : 'password'">
                      <button type="button" class="absolute top-0 right-0 p-2 text-gray-500 hover:text-gray-700"
                        (click)="togglingPasswordView('repassword')">
                        <mat-icon>{{confirmPasswordHide ? 'visibility_off' : 'visibility'}}</mat-icon>
                      </button>
                    <label for="password" class="text-gray-700 font-bold">Confirm Password</label>
                      
                    </div>
                  </div>
                  
                  <div class="d-flex justify-content-center mx-4 mb-8" >
                    <button type="submit" class="btn btn-primary btn-lg" [disabled]="!regForm.valid" value="Reginster">
                      <p *ngIf="!loading">Register</p>
                      <p *ngIf="loading">Loading ...</p>
                    </button>

                  </div>
                  <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                    <a class="text-blue-500 hover:font-semibold transition-all" routerLink="/login"> already have an
                      Account</a>
                  </div>
                </form>

              </div>

              <div class="mb-10">

                <img src="../../assets/book-logo-icon-design-vector.webp" class="img-fluid rounded-5"
                  alt="Sample image">

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
