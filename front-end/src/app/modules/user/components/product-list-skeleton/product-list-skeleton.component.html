<!-- Main product section -->
<div *ngIf="condition === 'view-products' ">
    <section class="py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="flex flex-col md:flex-row items-center">
                <!-- Product image skeleton -->
                <div class="w-full md:w-1/2 mb-5 md:mb-0">
                    <div class="bg-gray-200 animate-pulse w-1/2 h-64 mx-auto"></div>
                </div>
                <!-- Product details skeleton -->
                <div class="w-full md:w-1/2">
                    <div class="h-4 bg-gray-200 rounded w-1/4 mb-4 animate-pulse"></div>
                    <div class="h-8 bg-gray-200 rounded w-3/4 mb-4 animate-pulse"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2 mb-4 animate-pulse"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/4 mb-6 animate-pulse"></div>
                    <div class="h-20 bg-gray-200 rounded mb-6 animate-pulse"></div>
                    <div class="h-10 bg-gray-200 rounded w-1/3 animate-pulse"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Related items section -->
    <section class="py-5 bg-gray-100">
        <div class="container px-4 px-lg-5 mt-2">
            <div class="h-8 bg-gray-200 rounded w-1/4 mb-6 animate-pulse"></div>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Repeat this div 4 times for a grid of 4 items -->
                <div class="bg-white p-4 rounded-lg shadow">
                    <div class="bg-gray-200 h-48 rounded-lg mb-4 animate-pulse"></div>
                    <div class="h-4 bg-gray-200 rounded w-3/4 mb-2 animate-pulse"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2 animate-pulse"></div>
                </div>
                <!-- Repeat the above div 3 more times -->
            </div>
        </div>
    </section>
</div>
